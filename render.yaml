# Render 블루프린트: 저장소를 연결하면 이 설정으로 웹 서비스가 만들어진다(무료 플랜).
# 키 값(sync: false)은 Render 대시보드의 Environment에서 직접 입력한다. 소스에 넣지 않는다.
services:
  - type: web
    name: kjb-donn
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DONN_AUTOLOAD_PRODUCTS
        value: "1"
      - key: GEMINI_MODEL_CHAIN
        value: gemini-3.8-flash,gemini-3.7-flash,gemini-3.6-flash,gemini-3.5-flash-lite
      - key: FINLIFE_AUTH_KEY
        sync: false
      - key: DATA_GO_KR_SERVICE_KEY
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
