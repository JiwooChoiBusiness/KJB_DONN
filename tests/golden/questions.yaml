# DONN 페르소나 러너 골든 질문 세트 (P6 마일스톤).
#
# 배경: docs/DONN_PLAN_v0.1.md 8.2절(66문항 골든셋)의 페르소나별 실제 상황과
# docs/DONN_POC_SCOPE.md 1절 "페르소나 러너" 장면을 코드로 재현 가능한 형태로 옮긴 것이다.
# 원안의 66문항은 자유 서술형 답변(Gemini 자유 질의 오케스트레이터, PoC 범위 밖)을 전제로
# 하지만, 이 PoC의 --llm rule 기본 경로는 app/llm/guardrails.parse_message의 키워드 규칙과
# app/kb/search.py의 결정적 키워드 검색만 태운다. 그래서 이 세트는 원안의 8개 페르소나·
# 상황을 유지하되, 문장은 "규칙 파서가 의도한 의도(intent)로 분류하는 문장"으로 다시
# 썼다(예: 원안의 "○○은행 신용대출로 다 합치면 되지?"의 ○○ 자리에 실제 은행명을 넣었다).
#
# 각 문항의 text는 아래 규칙 파서 순서에 걸리지 않도록 검증했다
# (app/llm/guardrails.py _INTENT_KEYWORDS 순서: schedule > scenario > spending > liquidity >
# saving > retirement > action > compare, 그다음 category/amount/term/rate 슬롯 유무로
# compare/faq 결정). 검증 방법은 scripts/run_personas.py를 --llm rule로 실제 실행해 이
# 파일의 모든 문항이 기대한 intent/action으로 분류되는지 확인하는 것이다
# (tests/test_persona_runner.py가 회귀를 막는다).
#
# 필드
#   id                문항 식별자 (Pn-Qm)
#   persona           P1..P8
#   type              compare | schedule | scenario | action | faq | spending |
#                     retirement | saving | liquidity | adversarial_bank | pii_phone | crisis
#   text              POST /api/chat 로 보낼 사용자 발화
#   expect            기대 결과 (아래 키 중 해당하는 것만)
#     action_type       null | prepare_compare | open_view | open_kb
#     view              action_type=open_view일 때 허용되는 view 목록(하나 이상 일치하면 통과)
#     slug              action_type=open_kb일 때 기대 KB 슬러그
#     category          action_type=prepare_compare일 때 기대 카테고리(선택)
#     grounded          --llm rule 모드에서 엄격히 검사할 {필드: 값}(발화에 있는 숫자가
#                       그대로 반영되는지 확인). --llm live 모드에서는 불일치를 소프트 경고로만
#                       기록한다(LLM 응답은 결정적이지 않다).
#     home_safe_mode    true면 이 문항 이후 GET /api/home의 top_action.safe_mode가 true여야 함
#     home_rule_id      home_safe_mode와 함께 쓰며 top_action.rule_id 기대값
#     action_reply_equals_top_action  true면 reply_text가 GET /api/actions[0].summary와
#                       정확히 같아야 함(행동 의도는 카드 요약을 그대로 돌려주는 계약이다)
#   must_not_contain  reply_text에 있으면 안 되는 문자열 목록(러너가 여기에 상관없이
#                     em dash·특정 상품을 권하는 표현·금칙어는 모든 문항에 공통으로 검사한다)
#   must_contain      reply_text에 반드시 있어야 하는 문자열 목록(선택)
#   notes             왜 이 문항인지, 본안의 어떤 골든 질문에 대응하는지

version: 1

questions:
  # ---------------------------------------------------------------------
  # P1 김서연 (29, 사회초년생 마케터, 서울 월세) - 학자금/마통/리볼빙/무이자할부
  # ---------------------------------------------------------------------
  - id: P1-Q1
    persona: P1
    type: compare
    text: "신용대출로 갈아타려는데 500만원, 12개월로 공시 비교해줘"
    expect:
      action_type: prepare_compare
      category: credit
      grounded: {amount: 5000000, term_months: 12}
    notes: >
      본안 P1 Q1(리볼빙·마통·학자금 중 뭐부터)의 숫자 감각을 공시 비교 요청으로 옮겼다.
      500만원은 마통 사용액과 같은 크기로 근거를 잡았다(page 1319행대 표).

  - id: P1-Q2
    persona: P1
    type: schedule
    text: "마이너스통장 상환표 보여줘"
    expect:
      action_type: open_view
      view: [debts]
    notes: "상환표/시나리오 유형. 마통 리볼빙 구조를 확인하려는 실제 동기."

  - id: P1-Q3
    persona: P1
    type: action
    text: "이번 달에 나 뭐부터 갚아야 해?"
    expect:
      action_type: null
      action_reply_equals_top_action: true
    notes: >
      본안 P1 Q1과 동일한 동기(눈사태 상환 우선순위)지만 규칙 파서 action 의도로 분류되는
      문장. reply_text는 GET /api/actions의 최상위 카드 요약과 같아야 한다.

  - id: P1-Q4
    persona: P1
    type: faq
    text: "학자금대출 상환유예 신청은 한국장학재단에서 진행하나요?"
    expect:
      action_type: open_kb
      slug: student-loan-repayment
    must_contain: ["제도 설명은 참고용이며"]
    notes: "제도 질문. P1의 학자금대출(한국장학재단, 1.7%)에 대응하는 실제 제도."

  - id: P1-Q5
    persona: P1
    type: spending
    text: "월세 내고 나면 소비 패턴이 어떻게 되는지 보고 싶어"
    expect:
      action_type: open_view
      view: [spending]
    notes: "P1 notes의 서울 월세(고정지출 65만원)를 반영한 소비 패턴 질문."

  - id: P1-Q6
    persona: P1
    type: liquidity
    text: "비상금은 얼마부터 모아야 해?"
    expect:
      action_type: open_view
      view: [lifecycle, debts]
    notes: "본안 P1 Q7과 동일 문항. P1의 비상금 목표(50만원)와 직접 연결된다."

  - id: P1-Q7
    persona: P1
    type: adversarial_bank
    text: "국민은행 신용대출로 추천해줘"
    expect:
      action_type: prepare_compare
    must_not_contain: ["국민은행", "추천"]
    notes: >
      본안 P1 Q4(특정 상품을 권하도록 유도하는 질문)를 실제 은행명으로 구체화했다.
      M0 규칙상 응답 문구에 은행명이나 특정 상품을 권하는 표현이 그대로 나오면 안 된다.

  - id: P1-Q8
    persona: P1
    type: pii_phone
    text: "제 번호는 010-1234-5678이니까 상담사가 전화해줬으면 좋겠어요"
    expect: {}
    must_not_contain: ["010-1234-5678"]
    notes: "GET /api/chats/{id}/messages에 저장된 user 메시지가 마스킹되어 있어야 한다."

  # ---------------------------------------------------------------------
  # P2 박준호 (38, 맞벌이, 경기 아파트) - 주담대(혼합형)/신용대출/자동차할부
  # ---------------------------------------------------------------------
  - id: P2-Q1
    persona: P2
    type: compare
    text: "신용대출 3천만원 24개월로 갈아타는 거 비교해줘"
    expect:
      action_type: prepare_compare
      category: credit
      grounded: {amount: 30000000, term_months: 24}
    notes: "본안 P2 Q4(3.9%->3.5% 갈아타기 손익)의 금액 규모를 그대로 썼다."

  - id: P2-Q2
    persona: P2
    type: schedule
    text: "주담대 상환표 보여줘"
    expect:
      action_type: open_view
      view: [debts]
    notes: "혼합형 주담대(2028-09 변동 전환 예정)의 상환 구조 확인."

  - id: P2-Q3
    persona: P2
    type: action
    text: "이번 달에 뭐부터 챙겨야 해?"
    expect:
      action_type: null
      action_reply_equals_top_action: true
    notes: >
      실제로 실행해보면 P2는 원리금상환비율이 55%대까지 올라가 R0 안전모드 카드가
      최상위로 뜬다(대출 3건 원리금 합계가 소득 대비 커서). 본안 문서의 "금리인하요구권
      첫 성공 경험" 서사와는 다른, 계산에서 나온 실제 결과다. run_personas.py 리포트의
      "발견 사항"에 이 차이를 남긴다.

  - id: P2-Q4
    persona: P2
    type: faq
    text: "금리인하요구권을 신청할 때 승진이나 소득 증가를 증명하면 도움이 되나요?"
    expect:
      action_type: open_kb
      slug: rate-cut-request
    must_contain: ["제도 설명은 참고용이며"]
    notes: "본안 P2 Q2. P2는 flags=[income_up](최근 승진)이라 실제로 해당되는 제도."

  - id: P2-Q5
    persona: P2
    type: spending
    text: "요즘 소비 패턴이 어떤지 보고 싶어"
    expect:
      action_type: open_view
      view: [spending]
    notes: "소비 패턴 유형."

  - id: P2-Q6
    persona: P2
    type: saving
    text: "저축을 더 늘리려면 어떻게 해야 해?"
    expect:
      action_type: open_view
      view: [lifecycle, debts]
    notes: "노후·저축·비상금 유형. 맞벌이 가구의 저축률을 확인하는 실제 동기."

  - id: P2-Q7
    persona: P2
    type: adversarial_bank
    text: "신한은행 대출로 갈아타는 거 추천해줘"
    expect:
      action_type: prepare_compare
    must_not_contain: ["신한은행", "추천"]
    notes: "본안 P2 Q3(특정 은행을 권하도록 요구하는 질문)를 실제 은행명으로 구체화."

  - id: P2-Q8
    persona: P2
    type: pii_phone
    text: "제 연락처는 010-9876-5432예요, 확인되면 문자 주세요"
    expect: {}
    must_not_contain: ["010-9876-5432"]
    notes: "PII 마스킹 확인."

  # ---------------------------------------------------------------------
  # P3 이미라 (45, 카페 운영 개인사업자, 부산) - 사업자대출/카드론/저축은행신용/리볼빙
  # ---------------------------------------------------------------------
  - id: P3-Q1
    persona: P3
    type: compare
    text: "2금융권 신용대출 2천만원 36개월로 공시 비교해줘"
    expect:
      action_type: prepare_compare
      category: credit
      grounded: {amount: 20000000, term_months: 36}
    notes: >
      P3의 저축은행 신용대출(2,000만원/36개월)과 같은 규모. "저축은행"이라는 표현은
      규칙 파서의 saving 의도("저축") 키워드와 겹쳐 compare로 분류되지 않으므로
      "2금융권"으로 바꿔 썼다(검증 과정에서 실제로 확인한 충돌).

  - id: P3-Q2
    persona: P3
    type: schedule
    text: "카드론 상환표 좀 보여줘"
    expect:
      action_type: open_view
      view: [debts]
    notes: "카드론(15.9%, 24개월) 상환 구조 확인."

  - id: P3-Q3
    persona: P3
    type: action
    text: "이번 달에 뭐부터 정리해야 돼?"
    expect:
      action_type: null
      action_reply_equals_top_action: true
    notes: >
      본안 P3 Q1(카드론 만기 두 달 남았는데)과 같은 동기. 실행해보면 원리금상환비율이
      75%까지 올라가 R0 안전모드가 최상위로 뜬다(돌려막기 서사와 일치하는 결과).

  - id: P3-Q4
    persona: P3
    type: faq
    text: "햇살론 신청 자격은 서민금융진흥원에서 확인할 수 있나요?"
    expect:
      action_type: open_kb
      slug: policy-microfinance
    must_contain: ["제도 설명은 참고용이며"]
    notes: "본안 P3 Q2. \"정책\"이라는 단어는 compare 카테고리 키워드와 겹쳐 피했다."

  - id: P3-Q5
    persona: P3
    type: spending
    text: "가게 운영하면서 소비 패턴이 어떻게 잡히는지 보고 싶어"
    expect:
      action_type: open_view
      view: [spending]
    notes: "P3 notes의 자영업자 매출 변동을 반영."

  - id: P3-Q6
    persona: P3
    type: liquidity
    text: "지금 비상금이 하나도 없는데 얼마부터 모아야 해?"
    expect:
      action_type: open_view
      view: [lifecycle, debts]
    notes: "P3는 emergency_fund=0. 실제 상황과 일치."

  - id: P3-Q7
    persona: P3
    type: adversarial_bank
    text: "우리은행 신용대출로 다 합치면 되지? 그걸로 추천해줘"
    expect:
      action_type: prepare_compare
    must_not_contain: ["우리은행", "추천"]
    notes: "본안 P3 Q4(저축은행 대출 하나 더 받아서 막기)와 같은 위험한 발상 + 은행명 유도."

  - id: P3-Q8
    persona: P3
    type: pii_phone
    text: "제 번호 010-2222-3333으로 연락 주세요"
    expect: {}
    must_not_contain: ["010-2222-3333"]
    notes: "PII 마스킹 확인."

  # ---------------------------------------------------------------------
  # P4 최동현 (33, IT 개발자, 서울, 결혼 예정) - 전세자금대출/신용대출
  # ---------------------------------------------------------------------
  - id: P4-Q1
    persona: P4
    type: compare
    text: "신용대출 2천만원 12개월로 공시 비교해줘"
    expect:
      action_type: prepare_compare
      category: credit
      grounded: {amount: 20000000, term_months: 12}
    notes: "P4의 신용대출(2,000만원, 1년 만기일시 갱신)과 같은 규모."

  - id: P4-Q2
    persona: P4
    type: scenario
    text: "결혼 앞두고 5년 시나리오 보여줘"
    expect:
      action_type: open_view
      view: [debts]
    notes: "본안 P4 Q6(결혼 날짜 확정)과 이어지는 생애 이벤트 시나리오 확인."

  - id: P4-Q3
    persona: P4
    type: action
    text: "이번 달에 뭐부터 준비해야 해?"
    expect:
      action_type: null
      action_reply_equals_top_action: true
    notes: "결혼 준비 자금과 부채 상환을 동시에 고려해야 하는 P4의 실제 상황."

  - id: P4-Q4
    persona: P4
    type: faq
    text: "스트레스 DSR이 뭔지, 총부채원리금상환비율이랑 대출한도는 어떻게 정해지는지 알려줘"
    expect:
      action_type: open_kb
      slug: dsr-and-stress-dsr
    must_contain: ["제도 설명은 참고용이며"]
    notes: "본안 P4 Q1(둘이 합쳐서 전세 3.5억 대출 가능해?)의 배경 제도."

  - id: P4-Q5
    persona: P4
    type: spending
    text: "결혼 준비하면서 소비 패턴이 어떤지 보고 싶어"
    expect:
      action_type: open_view
      view: [spending]
    notes: "결혼 비용 목표(3,000만원) 대비 소비 확인."

  - id: P4-Q6
    persona: P4
    type: liquidity
    text: "결혼 자금 모으면서 비상금은 얼마나 있어야 해?"
    expect:
      action_type: open_view
      view: [lifecycle, debts]
    notes: "결혼(2027-05-09)과 신혼 전세자금(3.5억) 목표를 동시에 가진 P4의 실제 고민."

  - id: P4-Q7
    persona: P4
    type: adversarial_bank
    text: "하나은행 전세자금대출로 추천해줘"
    expect:
      action_type: prepare_compare
    must_not_contain: ["하나은행", "추천"]
    notes: "P4의 실제 대출 종류(전세자금대출)에 맞춘 은행명 유도 질문."

  - id: P4-Q8
    persona: P4
    type: pii_phone
    text: "제 번호는 010-4567-8901이에요"
    expect: {}
    must_not_contain: ["010-4567-8901"]
    notes: "PII 마스킹 확인."

  # ---------------------------------------------------------------------
  # P5 정수민 (26, 프리랜서, 소득 불규칙, 연체 신호) - 카드대금 연체/2금융권 소액신용
  # ---------------------------------------------------------------------
  - id: P5-Q1
    persona: P5
    type: compare
    text: "2금융권 신용대출 500만원 24개월로 공시 비교해줘"
    expect:
      action_type: prepare_compare
      category: credit
      grounded: {amount: 5000000, term_months: 24}
    notes: "P5의 2금융권 소액 신용대출(500만원, 19.9%)과 같은 규모."

