# DONN 규제/내부 기준 파라미터 (SPEC 2.2 policy.py 시드 키).
#
# needs_verification: true인 항목은 화면에 "(확인 필요)" 배지를 띄운다(SPEC 원칙 6).
# source_url/source_title는 docs/DONN_PLAN_v0.1.md 7.2.2(대출 규칙 참조 사양, 805~819행)와
# 14장 사실검증 로그(1775~1860행)에 실제로 등장하는 근거만 옮겼다. 이 세션에서 해당 URL을
# 직접 재검증하지는 않았으므로(문서가 검증한 기록을 인용) verified_at은 비워 둔다.
# 값 자체가 서비스 내부 휴리스틱(내부 기준)인 항목은 규제 출처가 없으므로 source를 비우고
# needs_verification: false로 둔다.
version: "0.1.0"
params:
  dsr_limit_bank_pct:
    value: 40
    unit: pct
    valid_from: null
    source_url: "https://www.fsc.go.kr/no010101/87517"
    source_title: "금융위원회 보도자료 (DSR 산정방식 관련, 확인 필요)"
    verified_at: null
    needs_verification: true
    note: >-
      은행권 DSR 한도 40%. 신용대출 간주만기(5년 vs 10년 상충 가능성, 은행업감독업무시행세칙
      원문 확인 필요)와 함께 본안 7.2.2, 14장 U10 참고.

  dsr_limit_nonbank_pct:
    value: 50
    unit: pct
    valid_from: null
    source_url: "https://www.fsc.go.kr/no010101/87517"
    source_title: "금융위원회 보도자료 (DSR 산정방식 관련, 확인 필요)"
    verified_at: null
    needs_verification: true
    note: >-
      비은행권 DSR 한도 50%. 업권별 예외 존재 가능성 있어 확인 필요(본안 7.2.2, 14장 U10).

  stress_dsr_rate_metro_pct:
    value: 3.0
    unit: pct_point
    valid_from: "2025-10-16"
    source_url: "https://www.fsc.go.kr/no010101/85824"
    source_title: "금융위원회 보도자료 (10·15 대책, 스트레스 DSR 수도권·규제지역 주담대 하한 상향)"
    verified_at: null
    needs_verification: true
    note: >-
      수도권·규제지역(서울 전역+경기 12곳) 주담대에 한정된 스트레스 금리 하한. 신용·기타대출은
      1.5%p 유지(stress_dsr_rate_other_pct 참고). 지방 주담대는 2026-07-01~12-31 한시 유예(0.75%p)
      적용 중이라 지역·상품별 실제 적용값은 서비스 시점에 재확인 필요(본안 14장 #8).

  stress_dsr_rate_other_pct:
    value: 1.5
    unit: pct_point
    valid_from: "2025-07-01"
    source_url: "https://www.fsc.go.kr/no010101/84617"
    source_title: "금융위원회 보도자료 (스트레스 DSR 3단계 시행)"
    verified_at: null
    needs_verification: true
    note: >-
      스트레스 DSR 3단계 기본 가산폭(신용대출 1억 초과분·기타대출). 수도권·규제지역 주담대는
      3.0%p(stress_dsr_rate_metro_pct) 별도 적용(본안 14장 #8).

  credit_loan_dsr_assumed_term_months:
    value: 60
    unit: months
    valid_from: null
    source_url: "https://www.fsc.go.kr/no010101/87517"
    source_title: "금융위원회 보도자료 (DSR 신용대출 간주만기 관련, 확인 필요)"
    verified_at: null
    needs_verification: true
    note: >-
      DSR 산정 시 신용대출 간주만기 5년(60개월) 가정. 은행업감독업무시행세칙 원문에서 10년
      표기와 상충하는 것으로 보여 원문 재확인 필요(본안 7.2.2, 14장 U10).

  prepay_fee_period_months:
    value: 36
    unit: months
    valid_from: "2025-01-13"
    source_url: "https://www.law.go.kr/LSW/admRulInfoR.do?admRulSeq=2100000278144"
    source_title: "금융소비자보호법 제20조 제1항 제4호(중도상환수수료 3년 이내 부과 법정기준); 새마을금고 감독기준(행안부고시 제2026-26호)"
    verified_at: null
    needs_verification: true
    note: >-
      대출계약 성립일로부터 3년 이내 상환분에 한해서만 수수료 부과 가능(법정 기준, 3년 초과 시
      면제). 2025-01-13 이후 신규계약은 실비용(자금운용손실+행정·모집비용) 기반 요율로 개편,
      상호금융 2026-01-01, 새마을금고 2026-05-01부터 적용(본안 7.2.2, 14장 #7). 상품·계약
      시점(contract_regime)별 실제 요율은 개별 확인 필요.

  interest_income_tax_pct:
    value: 15.4
    unit: pct
    valid_from: null
    source_url: ""
    source_title: ""
    verified_at: null
    needs_verification: true
    note: >-
      이자소득세(소득세+지방소득세) 통상 15.4%로 알려져 있으나 본안 문서에서 1차 출처(국세청
      원문)로 확인되지 않았다(본안 7.2.2). 예금 비교 시 세후 이자 계산에 사용.

  rate_cut_request_min_rate:
    value: 6.0
    unit: pct
    valid_from: null
    source_url: ""
    source_title: ""
    verified_at: null
    needs_verification: false
    note: >-
      내부 기준. 금리인하요구권 안내 칩을 띄울지 판단하는 참고 임계값(적용금리가 이 값 이상이면
      안내)으로, 규제 수치가 아닌 서비스 내부 휴리스틱이라 외부 출처가 없다.

  refi_rate_gap_min_pct:
    value: 1.0
    unit: pct_point
    valid_from: null
    source_url: ""
    source_title: ""
    verified_at: null
    needs_verification: false
    note: >-
      내부 기준. 대환 비교 카드를 제안할 최소 금리차(현재 금리 대비) 임계값. 서비스 내부
      휴리스틱이라 외부 출처가 없다.

  stress_variable_rate_add_pct:
    value: 1.0
    unit: pct_point
    valid_from: null
    source_url: ""
    source_title: ""
    verified_at: null
    needs_verification: false
    note: >-
      내부 기준. 변동금리 시나리오(app/core/scenarios.py)에서 쓰는 임의 가산폭이며, 규제상
      스트레스 DSR 가산금리(stress_dsr_rate_*)와는 별개의 서비스 내부 가정값이다.

  emergency_fund_months:
    value: 1
    unit: months_of_expenses
    valid_from: null
    source_url: ""
    source_title: ""
    verified_at: null
    needs_verification: false
    note: >-
      내부 기준. 최소 권장 비상금을 "월 고정지출 x 1개월"로 보는 서비스 내부 휴리스틱(R5 규칙
      참고), 규제 수치가 아니다.
