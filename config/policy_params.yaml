# needs_verification: true인 항목은 화면에 "(확인 필요)" 배지를 띄운다(SPEC 원칙 6).
# source_url/source_title는 docs/DONN_PLAN_v0.1.md 7.2.2(대출 규칙 참조 사양, 805~819행)와
